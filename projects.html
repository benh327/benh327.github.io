<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Your Name] - Portfolio</title>
    <style>
        /* Base Styles */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f4f7f6;
        }

        /* Header & Navigation */
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 4rem 1rem 2rem;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        header p {
            font-size: 1.6rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }
        nav {
            background-color: #1a252f;
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #3498db;
        }

        /* Main Content Container */
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Section Cards */
        section {
            background: white;
            padding: 2.5rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        /* Lists */
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 0.5rem;
        }

        /* Contact Links */
        .contact-links {
            display: flex;
            gap: 20px;
            margin-top: 1.5rem;
        }
        .contact-links a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .contact-links a:hover {
            background-color: #2980b9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #2c3e50;
            color: white;
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <header>
        <h1>Ben Howard</h1>
        <p>Project Portfolio</p>
    </header>

    <section>
        <h2>Senior Capstone Project</h2>
        <ul>
            <li><strong>Project 1:</strong> Description of project 1.</li>
            <li><strong>Project 2:</strong> Description of project 2.</li>
            <li><strong>Project 3:</strong> Description of project 3.</li>
            <!-- Add more projects as needed -->
        </ul>
</body>
